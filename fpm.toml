name = "subprocess"
version = "1.0.0"
maintainer = "David Pfister"
author = "David Pfister"
description = "experimental repo for subprocess spawning"
categories = ["process"]
keywords = ["subprocess", "fork"]
homepage = "https://github.com/davidpfister/subprocess.f"

[build]
auto-tests = true
[dependencies]
processlib = { path = "./lib" }

[preprocess]
cpp.suffixes = ["F90", "f90"]
cpp.macros = ["_WIN32", "_FPM"]

[library]
source-dir = "src"
include-dir = ["include"]

[install]
library = false

[[test]]
name = "test"
source-dir = "tests"

[extra.fortitude.check]
select = ["C", "E", "S"]
ignore = ["S001", "S061", "C121", "C003", "C071", "C072"]
line-length = 132